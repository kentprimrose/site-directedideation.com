services:
  staging-mcp:
    build:
      context: .build-context
      dockerfile: staging_mcp/Dockerfile
    image: directed-ideation-staging-mcp:local
    restart: unless-stopped
    ports:
      - "127.0.0.1:8765:8765"
    environment:
      STAGING_MCP_HOST: ${STAGING_MCP_HOST:-mcp-staging.directedideation.com}
      WORKOS_STAGING_ISSUER: ${WORKOS_STAGING_ISSUER:?Set the staging issuer}
      WORKOS_STAGING_ALLOWED_SUBJECTS: ${WORKOS_STAGING_ALLOWED_SUBJECTS:?Set exact staging subject IDs}
    read_only: true
    tmpfs:
      - /tmp:rw,noexec,nosuid,nodev,size=16m
    healthcheck:
      test: ["CMD", "python", "/app/healthcheck.py"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 15s
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    pids_limit: 100
    mem_limit: 256m
    cpus: 0.50
    logging:
      driver: json-file
      options:
        max-size: "1m"
        max-file: "2"
