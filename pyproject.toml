[project]
name = "site-directedideation.com"
version = "0.1.0"
description = "site-directedideation.com"
readme = "README.md"
requires-python = ">=3.15.0"
dependencies = [
    "fastapi",
    "fastmcp",
    "uvicorn",
]

[project.scripts]
dev = "site_directedideation_com.dev:main"

[dependency-groups]
dev = [
    "ty",
    "ruff",
    "rassumfrassum",
    "python-lsp-server[all]",
    "python-lsp-ruff",
    "pylsp-rope",
    "pytest",
    "pytest-cov",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/site_directedideation_com"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra"
markers = [
    "mcp: MCP capability probe tests",
    "integration: integration tests that start external services",
]

[tool.ruff]
target-version = "py315"
line-length = 88

[tool.ruff.lint]
select = ["E", "W", "F", "I", "D", "C90", "UP"]
ignore = ["D100", "D104", "D203", "D213"]

[tool.ruff.lint.mccabe]
max-complexity = 10

[tool.ruff.lint.pydocstyle]
convention = "google"

[tool.ruff.format]
quote-style = "double"

[tool.pylsp-server.plugins]
ruff.enabled = true
ruff.formatEnabled = true

pylsp_rope.enabled = true

pycodestyle.enabled = false
pyflakes.enabled = false
mccabe.enabled = false
pydocstyle.enabled = false
autopep8.enabled = false
yapf.enabled = false
pylint.enabled = false
